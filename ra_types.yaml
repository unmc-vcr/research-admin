id: https://nebraska.edu/research_administration/types
name: ra_types
title: Research Administration Types
description: >-
  Reusable scalar types for the research administration model: patterned identifiers
  (persons, organizations, sponsors, awards, publications) and constrained numerics.
  Patterns check syntax only. Check digits, registry existence, and cross-field rules
  belong in the ingest pipeline.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  ra: https://nebraska.edu/research_administration/
  xsd: http://www.w3.org/2001/XMLSchema#
  ORCID: https://orcid.org/
  ROR: https://ror.org/
  DOI: https://doi.org/
  PMID: https://pubmed.ncbi.nlm.nih.gov/
default_prefix: ra
default_range: string
emit_prefixes:
  - ra
  - linkml
  - xsd
  - ORCID
  - ROR
  - DOI
  - PMID
imports:
  - linkml:types

types:

  OrcidId:
    typeof: string
    uri: xsd:string
    title: ORCID iD
    description: >-
      An ORCID iD in bare, hyphenated form. Sixteen digits in four groups; the final
      character is an ISNI MOD 11-2 check character and may be X. The checksum is not
      verified by this pattern.
    pattern: "^\\d{4}-\\d{4}-\\d{4}-\\d{3}[0-9X]$"
    examples:
      - value: 0000-0002-1825-0097
      - value: 0000-0002-1694-233X

  OrcidCurie:
    typeof: uriorcurie
    uri: xsd:anyURI
    title: ORCID iD (CURIE)
    description: >-
      An ORCID iD as a CURIE expanding to https://orcid.org/{id}. Normalize the legacy
      http://orcid.org/ form on ingest; the two IRIs are not the same node.
    pattern: "^ORCID:\\d{4}-\\d{4}-\\d{4}-\\d{3}[0-9X]$"
    examples:
      - value: ORCID:0000-0002-1825-0097

  EraCommonsId:
    typeof: string
    uri: xsd:string
    title: eRA Commons username
    description: >-
      An eRA Commons account username. NIH publishes no formal syntax; this pattern is
      permissive and exists only to catch obviously malformed values.
    pattern: "^[A-Za-z][A-Za-z0-9_.-]{5,29}$"
    examples:
      - value: jcarberry

  RorId:
    typeof: string
    uri: xsd:string
    title: ROR ID
    description: >-
      A Research Organization Registry identifier in bare form: a leading 0, six
      characters from a crockford-style alphabet excluding i, l, o, and u, then two
      check digits. The check digits are not verified by this pattern.
    pattern: "^0[a-hj-km-np-tv-z0-9]{6}[0-9]{2}$"
    examples:
      - value: 00thqtb16

  RorCurie:
    typeof: uriorcurie
    uri: xsd:anyURI
    title: ROR ID (CURIE)
    description: A ROR ID as a CURIE expanding to https://ror.org/{id}.
    pattern: "^ROR:0[a-hj-km-np-tv-z0-9]{6}[0-9]{2}$"
    examples:
      - value: ROR:00thqtb16

  UniqueEntityId:
    typeof: string
    uri: xsd:string
    title: SAM.gov Unique Entity ID (UEI)
    description: >-
      A twelve-character alphanumeric SAM.gov Unique Entity ID. SAM excludes the letters
      O and I and does not issue values beginning with zero; confirm the current SAM.gov
      construction rules before relying on this pattern for anything but a format check.
    pattern: "^[A-HJ-NP-Z1-9][A-HJ-NP-Z0-9]{11}$"

  AssistanceListingNumber:
    typeof: string
    uri: xsd:string
    title: Assistance Listing number (formerly CFDA)
    description: >-
      A federal Assistance Listing number: a two-digit agency prefix, a period, and a
      three-digit program number.
    pattern: "^\\d{2}\\.\\d{3}$"
    examples:
      - value: "93.393"

  NihCoreProjectNumber:
    typeof: string
    uri: xsd:string
    title: NIH core project number
    description: >-
      The activity code, institute or center code, and serial number that stay constant
      across an NIH project's support years, for example R01CA123456.
    pattern: "^[A-Z]\\d{2}[A-Z]{2}\\d{6}$"
    examples:
      - value: R01CA123456

  NihFullProjectNumber:
    typeof: string
    uri: xsd:string
    title: NIH full project number
    description: >-
      An NIH project number including the application type prefix, support year, and any
      suffix segment, for example 5R01CA123456-02 or 3R01CA123456-02S1. Suffix
      conventions vary; treat a non-match as a value to review, not as an error.
    pattern: "^\\d[A-Z]\\d{2}[A-Z]{2}\\d{6}-\\d{2}([A-Z]\\d{1,2})?$"
    examples:
      - value: 5R01CA123456-02
      - value: 3R01CA123456-02S1

  Doi:
    typeof: string
    uri: xsd:string
    title: DOI
    description: A DOI in bare form, without a resolver prefix.
    pattern: "^10\\.\\d{4,9}/\\S+$"
    examples:
      - value: 10.1038/nature12373

  DoiCurie:
    typeof: uriorcurie
    uri: xsd:anyURI
    title: DOI (CURIE)
    description: A DOI as a CURIE expanding to https://doi.org/{doi}.
    pattern: "^DOI:10\\.\\d{4,9}/\\S+$"

  PubMedId:
    typeof: string
    uri: xsd:string
    title: PubMed ID
    description: A PubMed record identifier, digits only, with no PMID prefix.
    pattern: "^[1-9]\\d{0,8}$"
    examples:
      - value: "23842701"

  EffortPercent:
    typeof: decimal
    uri: xsd:decimal
    title: Effort percent
    description: >-
      Percent of a person's institutional base effort, 0 to 100. Person-months are the
      sponsor-facing unit for NIH; convert on export rather than storing both.
    minimum_value: 0
    maximum_value: 100

  MonetaryAmountValue:
    typeof: decimal
    uri: xsd:decimal
    title: Monetary amount
    description: >-
      A non-negative monetary value. Currency is carried separately; do not encode it in
      the value. Negative adjustments belong on a deobligation action, not here.
    minimum_value: 0

  FiscalYear:
    typeof: integer
    uri: xsd:integer
    title: Fiscal year
    description: >-
      A four-digit fiscal year. State whether it is the federal or institutional fiscal
      year in the slot description wherever this type is used.
    minimum_value: 1900
    maximum_value: 2200