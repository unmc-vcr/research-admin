name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Redundant pull-request runs are cancelled, but a run on main is left alone:
  # cancelling it mid-flight could abort a Pages deployment.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install LinkML
        run: pip install -r requirements.txt

      # Warnings here are style notes (missing descriptions and the like) and
      # should not fail the build; genuine schema errors still exit non-zero.
      - name: Lint schemas
        run: |
          rc=0
          # src/*/*.yaml covers schemas/, types/ and enums/ while skipping the
          # editor's src/.linkml-editor.yaml, which is config rather than a schema.
          for schema in src/*/*.yaml; do
            echo "::group::$schema"
            linkml-lint --ignore-warnings "$schema" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Build site
        run: python scripts/build_docs.py

      # The templates hand-build links and the diagram graph model, so a bad
      # relative path or an edge pointing at a missing node renders wrongly
      # rather than failing the build. Check for both explicitly.
      - name: Check output
        run: python scripts/check_site.py site

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Documentation site"
            echo
            for dir in site/*/; do
              [ -d "$dir" ] || continue
              echo "- \`${dir%/}\` — $(find "$dir" -name '*.html' | wc -l | tr -d ' ') pages"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Downloadable from the run page, so a pull request can be reviewed
      # without publishing it.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          if-no-files-found: error
          retention-days: 14

      - name: Package for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Deployments queue rather than cancel each other: a half-applied deploy
    # would leave the published site in an inconsistent state.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
