id: https://nebraska.edu/research_administration
name: research_administration
title: Research Administration
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  ra: https://nebraska.edu/research_administration
  ror: https://ror.org
default_prefix: ra
default_range: string
imports:
  - linkml:types
  - ra_types
  - ra_vocab
  - nacubo_functional_classification
settings:
  ror_prefix: https://ror\\.org/
  ror_suffix: 0[0-9a-hjkmnp-tv-z]{6}[0-9]{2}
slots:
  funded_item:
    range: Project
    required: true
    slot_uri: schema:fundedItem
  funder:
    range: Organization
    required: true
    slot_uri: schema:funder
  id:
    range: uriorcurie
    required: true
    identifier: true
  name:
    range: string
    slot_uri: schema:name
  funding_periods: {}
  award_type:
    range: AwardType
    required: true
  funding:
    range: Award
    multivalued: true
    inlined: true
  start_date:
    range: date
  end_date:
    range: date
  awards:
    range: Award
  proposals:
    range: Proposal
classes:
  CreativeWork:
    is_a: Thing
    class_uri: schema:CreativeWork
  Award:
    is_a: MonetaryGrant
    slots:
      - funded_item
      - funder
      - award_type
      - start_date
      - end_date
  MonetaryGrant:
    is_a: Grant
    class_uri: schema:MonetaryGrant
  Project:
    is_a: CreativeWork
    slots:
      - funding
      - start_date
      - end_date
      - awards
      - proposals
    attributes:
      lead_person:
        range: Person
        required: true
      project_classification:
        range: FunctionalExpenseCategory
  Organization:
    is_a: Thing
    class_uri: schema:Organization
    attributes:
      sub_organization:
        range: Organization
        slot_uri: schema:subOrganization
      parent_organization:
        range: Organization
        slot_uri: schema:parentOrganization
      ror_uri:
        range: RorCurie
  Thing:
    abstract: true
    class_uri: schema:Thing
    slots:
      - id
      - name
  Grant:
    is_a: Intangible
    class_uri: schema:Grant
  Proposal:
    is_a: Intangible
  Intangible:
    is_a: Thing
    class_uri: schema:Intangible
  Person:
    is_a: Thing
  StructuredValue:
    is_a: Intangible
    class_uri: schema:StructuredValue
  MonetaryAmount:
    is_a: StructuredValue
    class_uri: schema:MonetaryAmount
    attributes:
      currency:
        range: string
        required: true
      value:
        range: float
        required: true
      valid_from:
        range: datetime
      valid_through:
        range: datetime
  ProjectRole:
    is_a: Intangible
    slots:
      - end_date
      - start_date
    attributes:
      holder:
        range: Person
