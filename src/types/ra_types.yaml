id: https://nebraska.edu/research_administration/types
name: ra_types
title: Research Administration Types
description: >-
  Reusable scalar types for the research administration model: patterned identifiers (persons, organizations, sponsors,
  awards, publications) and constrained numerics. Patterns check syntax only. Check digits, registry existence, and
  cross-field rules belong in the ingest pipeline.
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  linkml: https://w3id.org/linkml/
  ra: https://nebraska.edu/research_administration/
  xsd: http://www.w3.org/2001/XMLSchema#
  ORCID: https://orcid.org/
  ROR: https://ror.org/
  DOI: https://doi.org/
  PMID: https://pubmed.ncbi.nlm.nih.gov/
default_prefix: ra
default_range: string
imports:
  - linkml:types
types:
  OrcidId:
    uri: xsd:string
    description: >-
      An ORCID iD in bare, hyphenated form. Sixteen digits in four groups; the final character is an ISNI MOD 11-2 check
      character and may be X. The checksum is not verified by this pattern.
    typeof: string
    pattern: ^\d{4}-\d{4}-\d{4}-\d{3}[0-9X]$
    title: ORCID iD
    examples:
      - value: 0000-0002-1825-0097
      - value: 0000-0002-1694-233X
  OrcidCurie:
    uri: xsd:anyURI
    description: >-
      An ORCID iD as a CURIE expanding to https://orcid.org/{id}. Normalize the legacy http://orcid.org/ form on ingest;
      the two IRIs are not the same node.
    typeof: uriorcurie
    pattern: ^ORCID:\d{4}-\d{4}-\d{4}-\d{3}[0-9X]$
    title: ORCID iD (CURIE)
    examples:
      - value: ORCID:0000-0002-1825-0097
  EraCommonsId:
    uri: xsd:string
    description: >-
      An eRA Commons account username. NIH publishes no formal syntax; this pattern is permissive and exists only to
      catch obviously malformed values.
    typeof: string
    pattern: ^[A-Za-z][A-Za-z0-9_.-]{5,29}$
    title: eRA Commons username
    examples:
      - value: jcarberry
  RorId:
    uri: xsd:string
    description: >-
      A Research Organization Registry identifier in bare form: a leading 0, six characters from a crockford-style
      alphabet excluding i, l, o, and u, then two check digits. The check digits are not verified by this pattern.
    typeof: string
    pattern: ^0[a-hj-km-np-tv-z0-9]{6}[0-9]{2}$
    title: ROR ID
    examples:
      - value: 00thqtb16
  RorCurie:
    uri: xsd:anyURI
    description: A ROR ID as a CURIE expanding to https://ror.org/{id}.
    typeof: uriorcurie
    pattern: ^ROR:0[a-hj-km-np-tv-z0-9]{6}[0-9]{2}$
    title: ROR ID (CURIE)
    examples:
      - value: ROR:00thqtb16
  UniqueEntityId:
    uri: xsd:string
    description: >-
      A twelve-character alphanumeric SAM.gov Unique Entity ID. SAM excludes the letters O and I and does not issue
      values beginning with zero; confirm the current SAM.gov construction rules before relying on this pattern for
      anything but a format check.
    typeof: string
    pattern: ^[A-HJ-NP-Z1-9][A-HJ-NP-Z0-9]{11}$
    title: SAM.gov Unique Entity ID (UEI)
  AssistanceListingNumber:
    uri: xsd:string
    description: 'A federal Assistance Listing number: a two-digit agency prefix, a period, and a three-digit program number.'
    typeof: string
    pattern: ^\d{2}\.\d{3}$
    title: Assistance Listing number (formerly CFDA)
    examples:
      - value: '93.393'
  NihCoreProjectNumber:
    uri: xsd:string
    description: >-
      The activity code, institute or center code, and serial number that stay constant across an NIH project's support
      years, for example R01CA123456.
    typeof: string
    pattern: ^[A-Z]\d{2}[A-Z]{2}\d{6}$
    title: NIH core project number
    examples:
      - value: R01CA123456
  NihFullProjectNumber:
    uri: xsd:string
    description: >-
      An NIH project number including the application type prefix, support year, and any suffix segment, for example
      5R01CA123456-02 or 3R01CA123456-02S1. Suffix conventions vary; treat a non-match as a value to review, not as an
      error.
    typeof: string
    pattern: ^\d[A-Z]\d{2}[A-Z]{2}\d{6}-\d{2}([A-Z]\d{1,2})?$
    title: NIH full project number
    examples:
      - value: 5R01CA123456-02
      - value: 3R01CA123456-02S1
  Doi:
    uri: xsd:string
    description: A DOI in bare form, without a resolver prefix.
    typeof: string
    pattern: ^10\.\d{4,9}/\S+$
    title: DOI
    examples:
      - value: 10.1038/nature12373
  DoiCurie:
    uri: xsd:anyURI
    description: A DOI as a CURIE expanding to https://doi.org/{doi}.
    typeof: uriorcurie
    pattern: ^DOI:10\.\d{4,9}/\S+$
    title: DOI (CURIE)
  PubMedId:
    uri: xsd:string
    description: A PubMed record identifier, digits only, with no PMID prefix.
    typeof: string
    pattern: ^[1-9]\d{0,8}$
    title: PubMed ID
    examples:
      - value: '23842701'
  EffortPercent:
    uri: xsd:decimal
    description: >-
      Percent of a person's institutional base effort, 0 to 100. Person-months are the sponsor-facing unit for NIH;
      convert on export rather than storing both.
    typeof: decimal
    minimum_value: 0
    maximum_value: 100
    title: Effort percent
  FiscalYear:
    uri: xsd:integer
    description: >-
      A four-digit fiscal year. State whether it is the federal or institutional fiscal year in the slot description
      wherever this type is used.
    typeof: integer
    minimum_value: 1900
    maximum_value: 2200
    title: Fiscal year
  MonetaryAmountValue:
    typeof: decimal
    uri: xsd:decimal
    title: Monetary amount
    description: >-
      A monetary value. May be negative: deobligations, budget reductions, and
      corrections are recorded as negative amounts on the action that made them.
      Currency is carried separately and is never encoded in the value.
emit_prefixes:
  - ra
  - linkml
  - xsd
  - ORCID
  - ROR
  - DOI
  - PMID
